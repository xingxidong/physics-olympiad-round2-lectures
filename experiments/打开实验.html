<script>
/* 离线参考实现：变量和方程与讲义第四章一致。 */
const Physics = (() => {
 const rk=(f,t,y,h)=>{const a=f(t,y),b=f(t+h/2,y.map((v,i)=>v+h*a[i]/2)),c=f(t+h/2,y.map((v,i)=>v+h*b[i]/2)),d=f(t+h,y.map((v,i)=>v+h*c[i]));return y.map((v,i)=>v+h*(a[i]+2*b[i]+2*c[i]+d[i])/6)};
 function integrate(f,y0,T,h,energy){let y=y0.slice(),t=0,rows=[[0,...y]],E0=energy?energy(y):0,drift=0;const every=Math.max(1,Math.ceil(T/h/1800));let n=0;while(t<T-1e-12){const dt=Math.min(h,T-t);y=rk(f,t,y,dt);t+=dt;n++;if(energy)drift=Math.max(drift,Math.abs(energy(y)-E0));if(n%every===0||t>=T-1e-10)rows.push([t,...y]);}return{rows,drift,E0};}
 function zero(f,y,t,h,index){let lo=0,hi=h;for(let j=0;j<35;j++){const mid=(lo+hi)/2,ym=rk(f,t,y,mid);if(ym[index]>0)lo=mid;else hi=mid;}return{time:t+(lo+hi)/2,y:rk(f,t,y,(lo+hi)/2)};}
 function pendulum(deg=60,h=.015,cycles=8){const a=deg*Math.PI/180,f=(t,y)=>[y[1],-Math.sin(y[0])],s=Math.sin(a/2);let sum=0,N=2000;for(let j=0;j<=N;j++){const u=j*Math.PI/2/N;sum+=(j===0||j===N?1:j%2?4:2)/Math.sqrt(1-s*s*Math.sin(u)**2);}const integral=4*sum*(Math.PI/2/N)/3;let y=[a,0],t=0,period=null;while(t<20){const z=rk(f,t,y,h);if(y[0]>0&&z[0]<=0){period=4*zero(f,y,t,h,0).time;break;}y=z;t+=h;}const r=integrate(f,[a,0],cycles*2*Math.PI,h,y=>.5*y[1]**2+1-Math.cos(y[0]));return{...r,period,integral,ratio:period/(2*Math.PI),approx:1+a*a/16,angle:a};}
 function resonance(z=.1){const rows=[];for(let j=0;j<=500;j++){const o=j*2/500,d=(1-o*o)**2+4*z*z*o*o,A=1/Math.sqrt(d);rows.push([o,A,o*A,z*o*o*A*A,Math.atan2(2*z*o,1-o*o)]);}return{rows,peakA:z<Math.SQRT1_2?Math.sqrt(1-2*z*z):0,peakV:1,lo:Math.sqrt(1+z*z)-z,hi:Math.sqrt(1+z*z)+z};}
 function transient(z=.1,o=1){const den=(1-o*o)**2+4*z*z*o*o,re=(1-o*o)/den,im=-2*z*o/den,w=Math.sqrt(1-z*z),C=-re,D=(o*im+z*C)/w,rows=[],T=Math.min(600,Math.max(40,8/z));for(let j=0;j<=1600;j++){const t=T*j/1600,qss=re*Math.cos(o*t)-im*Math.sin(o*t),q=qss+Math.exp(-z*t)*(C*Math.cos(w*t)+D*Math.sin(w*t));rows.push([t,q,qss]);}return rows;}
 function coupled(e=.02,d=0,h=.025){const D=Math.hypot(e,d),wm=Math.sqrt(1+e-D),wp=Math.sqrt(1+e+D),gap=wp-wm,T=2*Math.PI/gap;
 const f=(t,y)=>[y[2],y[3],-(1+e+d)*y[0]+e*y[1],e*y[0]-(1+e-d)*y[1]],energy=y=>.5*(y[2]**2+y[3]**2+(1+d)*y[0]**2+(1-d)*y[1]**2+e*(y[1]-y[0])**2);
 const r=integrate(f,[1,0,0,0],T,h,energy);let maxError=0;
 r.rows=r.rows.map(v=>{const t=v[0],exact1=.5*((1-d/D)*Math.cos(wm*t)+(1+d/D)*Math.cos(wp*t)),exact2=e/(2*D)*(Math.cos(wm*t)-Math.cos(wp*t));maxError=Math.max(maxError,Math.abs(v[1]-exact1),Math.abs(v[2]-exact2));return [...v,e/D*Math.abs(Math.sin(gap*t/2)),.5*(v[3]**2+(1+d)*v[1]**2),.5*(v[4]**2+(1-d)*v[2]**2),.5*e*(v[2]-v[1])**2];});
 return{...r,wm,wp,peakTime:Math.PI/gap,envelope:e/D,eta:e*e/(D*D),maxError};}
 function trajectory(deg=45,beta=1,h=.005){const a=deg*Math.PI/180;const f=(t,y)=>{const v=Math.hypot(y[2],y[3]);return[y[2],y[3],-beta*v*y[2],-1-beta*v*y[3],beta*v**3]};let y=[0,0,Math.cos(a),Math.sin(a),0],t=0,rows=[[0,...y]],err=0;while(t<10){const yn=rk(f,t,y,h);if(yn[1]<0&&t>0){const hit=zero(f,y,t,h,1);rows.push([hit.time,...hit.y]);return{rows,range:hit.y[0],time:hit.time,balanceError:Math.max(err,Math.abs(.5*(hit.y[2]**2+hit.y[3]**2)+hit.y[1]+hit.y[4]-.5))};}y=yn;t+=h;err=Math.max(err,Math.abs(.5*(y[2]**2+y[3]**2)+y[1]+y[4]-.5));rows.push([t,...y]);}throw Error('未找到落地事件');}
 function projectile(deg=45,beta=1,h=.005){const r=trajectory(deg,beta,h),scan=[];for(let a=5;a<=85;a+=1)scan.push([a,trajectory(a,beta,h).range]);let lo=5,hi=85;for(let i=0;i<32;i++){const a=(2*lo+hi)/3,b=(lo+2*hi)/3;if(trajectory(a,beta,h).range<trajectory(b,beta,h).range)lo=a;else hi=b;}const optimum=(lo+hi)/2;return{...r,scan,optimum,maxRange:trajectory(optimum,beta,h).range};}
 function solve(A,b){A=A.map((r,i)=>[...r,b[i]]);const n=b.length;for(let k=0;k<n;k++){let p=k;for(let j=k+1;j<n;j++)if(Math.abs(A[j][k])>Math.abs(A[p][k]))p=j;[A[k],A[p]]=[A[p],A[k]];const v=A[k][k];if(Math.abs(v)<1e-14)throw Error('拟合矩阵奇异');for(let j=k;j<=n;j++)A[k][j]/=v;for(let i=0;i<n;i++)if(i!==k){const q=A[i][k];for(let j=k;j<=n;j++)A[i][j]-=q*A[k][j];}}return A.map(r=>r[n]);}
 function fitting(sigma=.02){const xs=[0,.01,.02,.03,.04,.05,.06],ys=[.20,1.01,1.83,2.70,3.65,4.71,5.87];function fit(cubic){const A=xs.map(x=>cubic?[1,x/.06,(x/.06)**3]:[1,x/.06]),n=A[0].length,G=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>A.reduce((v,r)=>v+r[i]*r[j],0))),b=Array.from({length:n},(_,i)=>A.reduce((v,r,j)=>v+r[i]*ys[j],0)),coef=solve(G,b),predict=A.map(r=>r.reduce((v,q,j)=>v+q*coef[j],0)),res=ys.map((v,i)=>v-predict[i]);return{coef,predict,res,chi:res.reduce((v,r)=>v+(r/sigma)**2,0),dof:7-n};}return{xs,ys,linear:fit(false),cubic:fit(true)};}
 return{rk,pendulum,resonance,transient,coupled,trajectory,projectile,fitting};
})();
if(typeof module!=='undefined')module.exports=Physics;

function draw(cv,ss,xlabel,ylabel){const w=Math.max(320,cv.clientWidth),h=cv.clientHeight,d=devicePixelRatio||1;cv.width=w*d;cv.height=h*d;const c=cv.getContext('2d');c.scale(d,d);const all=ss.flatMap(s=>s.pts).filter(v=>Number.isFinite(v[0])&&Number.isFinite(v[1]));let xmin=Math.min(...all.map(v=>v[0])),xmax=Math.max(...all.map(v=>v[0])),ymin=Math.min(...all.map(v=>v[1])),ymax=Math.max(...all.map(v=>v[1]));if(xmin===xmax)xmax=xmin+1;const dy=(ymax-ymin)||1;ymin-=dy*.08;ymax+=dy*.12;const L=65,R=15,T=24,B=42,X=x=>L+(x-xmin)/(xmax-xmin)*(w-L-R),Y=y=>h-B-(y-ymin)/(ymax-ymin)*(h-B-T);c.font='12px -apple-system, PingFang SC, sans-serif';c.lineWidth=1;for(let i=0;i<=4;i++){const y=ymin+(ymax-ymin)*i/4;c.strokeStyle='#e4e8e9';c.beginPath();c.moveTo(L,Y(y));c.lineTo(w-R,Y(y));c.stroke();c.fillStyle='#52636c';c.textAlign='right';c.fillText(Number(y.toPrecision(3)),L-8,Y(y)+4);const x=xmin+(xmax-xmin)*i/4;c.textAlign='center';c.fillText(Number(x.toPrecision(3)),X(x),h-B+20);}c.fillStyle='#17252c';c.textAlign='left';c.fillText(ylabel,L,14);c.textAlign='right';c.fillText(xlabel,w-R,h-3);ss.forEach((s,i)=>{c.strokeStyle=C[i];c.lineWidth=1.7;c.setLineDash(s.dash?[6,4]:[]);c.beginPath();s.pts.forEach((p,j)=>j?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1])));c.stroke();if(s.dots){c.setLineDash([]);s.pts.forEach(p=>{c.beginPath();c.arc(X(p[0]),Y(p[1]),3,0,Math.PI*2);c.fillStyle=C[i];c.fill()})}});c.setLineDash([])}
function setup(tab){state.tab=tab;state.h=.015;$('tabs').innerHTML='';for(const [key,d] of Object.entries(defs)){const b=document.createElement('button');b.textContent=d[0];b.setAttribute('aria-selected',key===tab);b.onclick=()=>setup(key);$('tabs').append(b)}$('controls').innerHTML='';if(tab==='pendulum'){control('angle','初始角度 / 度',5,120,1);control('cycles','观察时间 / 小角周期',2,40,1)}if(tab==='resonance'){control('zeta','阻尼比',.02,.8,.01);control('omega','驱动频率比',.1,2,.01)}if(tab==='coupled'){control('epsilon','耦合强度 κ/k',.01,.15,.005);control('delta','失谐 δ',0,.15,.005)}if(tab==='projectile'){control('launch','发射角 / 度',5,85,.5);control('beta','阻力参数 β',0,3,.1)}if(tab==='fitting')control('sigma','力测量标准差 / N',.01,.10,.005);render();}

 if(state.tab==='pendulum'){result=Physics.pendulum(state.angle,state.h,state.cycles);const r=result;metrics([['周期比 T/T₀',fmt(r.ratio)],['二阶近似',fmt(r.approx)],['两路线周期之差',Math.abs(r.period-r.integral).toExponential(2)],['相对能量漂移',(r.drift/r.E0).toExponential(2)]]);chart('角度随时间',[{name:'非线性模型',pts:r.rows.map(v=>[v[0],v[1]])},{name:'小角模型',dash:true,pts:r.rows.map(v=>[v[0],r.angle*Math.cos(v[0])])}],'τ','θ / rad');chart('相图',[{name:'非线性轨道',pts:r.rows.map(v=>[v[1],v[2]])}],'θ / rad','dθ/dτ');exportRows=r.rows.map(v=>({tau:v[0],theta:v[1],p:v[2],linear_theta:r.angle*Math.cos(v[0]),energy:.5*v[2]**2+1-Math.cos(v[1])}));prompt=`制作无阻尼单摆实验，使用 θ′=p，p′=−sinθ，初始角度${state.angle}度、初速度0，观察${state.cycles}个小角周期。角度转弧度后计算。显示非线性与小角模型、相图、能量漂移。用首次向下过零时刻乘4测周期，并用能量积分独立核对。输出可离线打开的完整 HTML、可导出数据及两组计算精度的比较。先列出模型和初值，再实现。`;checks='小振幅时 T/T₀ 应趋近1。比较周期积分与事件定位；能量应近似恒定，长时间相位差仍可能增长。点击“提高精度并比较”检查周期的稳定位数。';expl='周期参考积分使用独立的能量关系。动画式的时间曲线可帮助观察，但误差应根据数值差和能量漂移判断。'}
 if(state.tab==='resonance'){result=Physics.resonance(state.zeta);const r=result,tr=Physics.transient(state.zeta,state.omega);metrics([['位移峰频率比',fmt(r.peakA)],['速度与功率峰','1'],['半功率点',fmt(r.lo,4)+' / '+fmt(r.hi,4)]]);let max=[1,2,3].map(j=>Math.max(...r.rows.map(v=>v[j])));chart('分别归一化的频率响应',[{name:'位移',pts:r.rows.map(v=>[v[0],v[1]/max[0]])},{name:'速度',dash:true,pts:r.rows.map(v=>[v[0],v[2]/max[1]])},{name:'功率',pts:r.rows.map(v=>[v[0],v[3]/max[2]])}],'Ω','响应 / 各自最大值');chart('选定频率下的零初值运动',[{name:'完整运动',pts:tr.map(v=>[v[0],v[1]])},{name:'纯稳态',dash:true,pts:tr.map(v=>[v[0],v[2]])}],'τ','q');exportRows=r.rows.map(v=>({Omega:v[0],displacement:v[1],velocity:v[2],power:v[3],lag_rad:v[4]}));prompt=`制作 q″+2ζq′+q=cos(Ωτ) 的可调参数实验，当前 ζ=${state.zeta}，Ω=${state.omega}，零初值。分别显示位移、速度、平均功率和相位；注明峰值量与有效值区别。比较解析稳态与数值启动过程，报告等待时间。用 atan2 处理相位，在峰附近细化频率扫描。保存代码和数据。`;checks='位移峰仅在 ζ<1/√2 时位于非零频率；速度和功率峰都在1。瞬态衰减时间随阻尼减小而增大。本页使用解析响应和完整解析运动。';expl='图中三条曲线分别除以各自最大值，仅用于比较峰的位置。导出的数据保留原始无量纲响应。'}
 if(state.tab==='coupled'){result=Physics.coupled(state.epsilon,state.delta,state.h);const r=result;metrics([['两正常模频率',fmt(r.wm,5)+' / '+fmt(r.wp,5)],['第二物块包络上界',fmt(r.envelope)],['首次包络峰时间',fmt(r.peakTime)],['数值与解析最大差',r.maxError.toExponential(2)]]);chart('第二物块与慢包络',[{name:'位移 q₂',pts:r.rows.map(v=>[v[0],v[2]])},{name:'正包络',dash:true,pts:r.rows.map(v=>[v[0],v[5]])},{name:'负包络',dash:true,pts:r.rows.map(v=>[v[0],-v[5]])}],'τ','q₂');chart('能量如何分配',[{name:'左侧局部能量',pts:r.rows.map(v=>[v[0],v[6]])},{name:'右侧局部能量',pts:r.rows.map(v=>[v[0],v[7]])},{name:'耦合弹簧',pts:r.rows.map(v=>[v[0],v[8]])}],'τ','无量纲能量');exportRows=r.rows.map(v=>({tau:v[0],q1:v[1],q2:v[2],p1:v[3],p2:v[4],envelope:v[5],E1:v[6],E2:v[7],Ec:v[8]}));prompt=`建立双振子 q″+Kq=0，K=[[1+ε+δ,−ε],[−ε,1+ε−δ]]，ε=${state.epsilon}，δ=${state.delta}，初始位移(1,0)、初速度(0,0)。用模态解析解和独立积分交叉检查。显示两位移、第二物块慢包络、三部分能量及总能量漂移；观察一整个包络周期。检验 δ=0 和失谐增大的情况，明确最大能量转移比例只是弱耦合首阶近似。`;checks=`完整总能量须含耦合项。本次相对总能量漂移 ${(r.drift/r.E0).toExponential(3)}。首阶平均能量转移比例约 ${fmt(r.eta,4)}，不要把它当成任意时刻的精确局部能量比例。`;expl='失谐增加可能同时使包络峰提前、峰值减小。分别从频差和模态混合解释这两种变化。'}
 if(state.tab==='projectile'){result=Physics.projectile(state.launch,state.beta,state.h/3);const r=result;metrics([['当前射程',fmt(r.range)],['当前落地时间',fmt(r.time)],['最佳发射角 / 度',fmt(r.optimum)],['能量收支最大差',r.balanceError.toExponential(2)]]);chart('到首次落地为止的轨迹',[{name:'当前轨迹',pts:r.rows.map(v=>[v[1],v[2]])}],'X','Y');chart('不同发射角的射程',[{name:'扫描结果',pts:r.scan}],'α / 度','无量纲射程');exportRows=r.rows.map(v=>({tau:v[0],X:v[1],Y:v[2],U:v[3],V:v[4],dissipated_energy:v[5]}));prompt=`模拟二次阻力抛体：X′=U，Y′=V，U′=−β√(U²+V²)U，V′=−1−β√(U²+V²)V，β=${state.beta}，发射角${state.launch}度，初速度模为1，位置(0,0)。首次向下过 Y=0 时终止，排除发射时刻。扫描5至85度并细化最大值，输出最佳角度、射程和轨迹。检查 β=0 时射程 sin(2α)，并比较能量变化与阻力功率积分。输出两种精度设置的结果及完整文件。`;checks='必须使用总速率决定两个阻力分量。落地采用过零事件细化；能量检查包括累计耗散。无阻力时最佳角为45度、最大无量纲射程为1。';expl='这里的长度单位为 v₀²/g，时间单位为 v₀/g。改变有量纲初速也会改变 β，不能只放大坐标轴。'}
 if(state.tab==='fitting'){result=Physics.fitting(state.sigma);const r=result,a=r.linear,b=r.cubic;metrics([['线性刚度 / N·m⁻¹',fmt(a.coef[1]/.06)],['三次模型刚度',fmt(b.coef[1]/.06)],['线性 χ²',fmt(a.chi,5)],['三次模型 χ²',fmt(b.chi,5)]]);chart('测量与拟合',[{name:'模拟测量',dots:true,pts:r.xs.map((x,i)=>[x,r.ys[i]])},{name:'线性拟合',pts:r.xs.map((x,i)=>[x,a.predict[i]])},{name:'含三次项',dash:true,pts:r.xs.map((x,i)=>[x,b.predict[i]])}],'x / m','F / N');chart('残差与测量尺度',[{name:'线性残差',dots:true,pts:r.xs.map((x,i)=>[x,a.res[i]])},{name:'三次项残差',dots:true,pts:r.xs.map((x,i)=>[x,b.res[i]])},{name:'+σ',dash:true,pts:r.xs.map(x=>[x,state.sigma])},{name:'−σ',dash:true,pts:r.xs.map(x=>[x,-state.sigma])}],'x / m','残差 / N');exportRows=r.xs.map((x,i)=>({x_m:x,F_N:r.ys[i],sigma_N:state.sigma,linear_residual:a.res[i],cubic_residual:b.res[i]}));prompt=`用以下教学模拟数据分析弹簧，x(m)=[0,.01,.02,.03,.04,.05,.06]，F(N)=[.20,1.01,1.83,2.70,3.65,4.71,5.87]，各力标准差${state.sigma} N。分别拟合 F=b+kx 与 F=b+kx+c x³，列出参数单位、残差、归一化残差平方和及自由度。检查残差正交条件；解释改变所有标准差对参数和 χ² 的影响。提出新测量来区分两个模型。不要把模拟数据称为实测。`;checks='等权线性拟合的残差和、x加权残差和应接近零。改变所有测量标准差的共同尺度不改变拟合参数，但会改变 χ² 和给定误差约定下的参数不确定度。';expl=`含三次项模型：b=${fmt(b.coef[0])} N，k=${fmt(b.coef[1]/.06)} N/m，c=${fmt(b.coef[2]/.06**3)} N/m³。两模型自由度分别为5和4；较小的残差不能单独证明模型的物理正确性。`;}
 $('prompt').textContent=prompt;$('checks').textContent=checks;$('explanation').textContent=expl;
 }catch(e){$('status').textContent='计算未完成：'+e.message;console.error(e)}}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').textContent);$('status').textContent='已复制。可粘贴到所用 AI，要求先核对方程与初值。'}catch{$('status').textContent='请展开下方任务文本后手动复制。'}};
$('export').onclick=()=>{const keys=Object.keys(exportRows[0]),csv=keys.join(',')+'\n'+exportRows.map(r=>keys.map(k=>r[k]).join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=state.tab+'_data.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='已导出当前参数下的数据。';};
$('refine').onclick=()=>{const tab=state.tab,old=tab==='pendulum'?result.period:tab==='coupled'?result.maxError:result.range,h=state.h;if(h<.001){$('status').textContent='当前步长已很小，请比较已得到的稳定位数。';return}state.h/=2;render();const now=tab==='pendulum'?result.period:tab==='coupled'?result.maxError:result.range;$('status').textContent=`计算步长减半：比较量由 ${fmt(old,10)} 变为 ${fmt(now,10)}，差 ${Math.abs(now-old).toExponential(3)}。${tab==='coupled'?'此处比较的是数值与解析解的最大差。':''}`;};
window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(render,150)});setup('pendulum');
</script></html>
